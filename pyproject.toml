[project]
name = "cryptoshot"
version = "0.1.0"
description = "Retrieve cryptocurrency balances and values at a specific point in time"
authors = [{ name = "Ross", email = "git@ross.ch" }]
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.34.2",
  "rich>=15.0.0",
]

[project.scripts]
cryptoshot = "cryptoshot.__main__:main"

[dependency-groups]
# Development-only dependencies
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.20",
  "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.isort]
line_length = 100
